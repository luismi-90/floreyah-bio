<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floreyah | Flores que hablan por ti</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="floral-decor decor-top-left"></div>
    <div class="floral-decor decor-bottom-right"></div>

    <main class="container">
        <header class="header">
            <div class="logo-wrapper">
                <img src="assets/logo.png" alt="Logotipo Floreyah" class="logo">
            </div>
            <h1 class="brand-name"></h1>
            <p class="tagline">flores eternas, sentimientos eternos 🌷</p>
    
        </header>

        <section class="links-wrapper">
            <!-- TikTok -->
            <a href="#" id="link-tiktok" class="social-btn" target="_blank" rel="noopener noreferrer">
                <div class="icon-container">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="btn-content">
                    <h2>TikTok</h2>
                    <p>Descubre nuestras creaciones</p>
                </div>
            </a>

            <!-- Facebook -->
            <a href="#" id="link-facebook" class="social-btn" target="_blank" rel="noopener noreferrer">
                <div class="icon-container">
                    <i class="fa-brands fa-facebook-f"></i>
                </div>
                <div class="btn-content">
                    <h2>Facebook</h2>
                    <p>Conoce nuestras novedades</p>
                </div>
            </a>

            <!-- WhatsApp -->
            <a href="#" id="link-whatsapp" class="social-btn" target="_blank" rel="noopener noreferrer">
                <div class="icon-container">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <div class="btn-content">
                    <h2>WhatsApp</h2>
                    <p>Haz tu consulta</p>
                </div>
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
